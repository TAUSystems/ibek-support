# yaml-language-server: $schema=https://github.com/epics-containers/ibek/releases/download/3.0.1/ibek.support.schema.json

module: arroyo

entity_models:
  - name: ArroyoLaserSourceUSB
    description: |-
      Arroyo laser diode driver via USB interface

    parameters:
      PORT:
        type: id
        description: |-
          Name to use for the Asyn port

      path:
        type: str
        description: |-
          USB serial port path, e.g. /dev/serial/by-id/usb-FTDI_USB-Serial_Converter_12345-if00-port0

      P:
        type: str
        description: |-
          Prefix for PV name

      R:
        type: str
        description: |-
          Suffix for PV name

    sub_entities:
      - type: asyn.AsynSerial
        # asyn.AsynSerial.port is the USB or IP address
        port: "{{ path }}"
        # asyn.AsynSerial.name is the name to use for the Asyn port
        name: "{{ PORT }}"
        input_eos: \r\n
        output_eos: \r\n
        baud: 38400
        parity: N
        stop: 1
        bits: 8

    databases:
      - file: $(ARROYO)/db/arroyo-all.db
        args:
          P:
          R:
          PORT:
      
      - file: $(ARROYO)/db/laser.db
        args:
          P:
          R:
          PORT:
      
      - file: $(ASYN)/db/asynRecord.db
        args:
          P: "Asyn:"
          R: "{{ PORT }}"
          PORT:
          ADDR: "0"
          OMAX: "128"
          IMAX: "128"
