label: Basler Camera
children:
  - type: Include
    file_name: ADDriver

  - type: Group
    name: ADPylon
    layout:
      type: Grid
      labelled: true
    children:
      - type: SignalRW
        name: TimeStampMode
        write_pv: $(P)$(R)TimeStampMode
        write_widget:
          type: ComboBox
        read_pv: $(P)$(R)TimeStampMode_RBV
        read_widget:
          type: TextRead

      - type: SignalRW
        name: UniqueIdMode
        write_pv: $(P)$(R)UniqueIdMode
        write_widget:
          type: ComboBox
        read_pv: $(P)$(R)UniqueIdMode_RBV
        read_widget:
          type: TextRead

      - type: SignalRW
        name: ConvertPixelFormat
        write_pv: $(P)$(R)ConvertPixelFormat
        write_widget:
          type: ComboBox
        read_pv: $(P)$(R)ConvertPixelFormat_RBV
        read_widget:
          type: TextRead

      - type: SignalRW
        name: ConvertBitAlign
        write_pv: $(P)$(R)ConvertBitAlign
        write_widget:
          type: ComboBox
        read_pv: $(P)$(R)ConvertBitAlign_RBV
        read_widget:
          type: TextRead

      - type: SignalRW
        name: ConvertShiftBits
        write_pv: $(P)$(R)ConvertShiftBits
        write_widget:
          type: ComboBox
        read_pv: $(P)$(R)ConvertShiftBits_RBV
        read_widget:
          type: TextRead

      - type: SignalR
        name: GCStatBufferReceived
        read_pv: $(P)$(R)GC_StatBufferReceived_RBV
        read_widget:
          type: TextRead

      - type: SignalR
        name: GCStatBufferFailed
        read_pv: $(P)$(R)GC_StatBufferFailed_RBV
        read_widget:
          type: TextRead

      - type: SignalR
        name: GCStatBufferUnderrun
        read_pv: $(P)$(R)GC_StatBufferUnderrun_RBV
        read_widget:
          type: TextRead

      - type: SignalR
        name: GCStatPacketReceived
        read_pv: $(P)$(R)GC_StatPacketReceived_RBV
        read_widget:
          type: TextRead

      - type: SignalR
        name: GCStatPacketFailed
        read_pv: $(P)$(R)GC_StatPacketFailed_RBV
        read_widget:
          type: TextRead

      - type: SignalR
        name: GCStatPacketRequested
        read_pv: $(P)$(R)GC_StatPacketRequested_RBV
        read_widget:
          type: TextRead

      - type: SignalR
        name: GCStatPacketResent
        read_pv: $(P)$(R)GC_StatPacketResent_RBV
        read_widget:
          type: TextRead
