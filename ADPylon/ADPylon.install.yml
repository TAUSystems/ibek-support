# yaml-language-server: $schema=../_scripts/support_install_variables.json

module: ADPylon
version: d62a8e3

dbds:
  - ADPylonSupport.dbd
libs:
  - ADPylon

organization: http://github.com/areaDetector

download_extras:
  - url: https://downloads-bsl.baslerweb.com/software/pylon%2025.11.0/pylon-25.11.0_linux-x86_64_setup.tar.gz
    dest: /tmp/pylon_setup.tar.gz

tasks:
  - path: install_pylon_task.yml

apt_developer:
  - aravis-tools-cli

# incorrecly placed macro does not get overriden by RELEASE.local. Remove it.
comment_out:
  - path: configure/RELEASE
    regexp: "ADGENICAM"

patch_blocks:
  - path: "{{ config_linux_host }}"
    block: |
      CHECK_RELEASE=WARN
      AREA_DETECTOR=/epics/support
      CROSS_COMPILER_TARGET_ARCHS =

# Copy the pylon library built above to the runtime stage
# Unnecessary files in /opt/pylon are deleted later in the build, keeping only 
#   /opt/pylon/lib
#   /opt/pylon/bin/pylongigeconnectionguard
#
# They must be copied and later deleted (rather than including only those files 
# in runtime_files below) because of the way ibek copies runtime_files. For 
# runtime_files ending in 'lib' (or bin, or db) ibek applies `strip` to the files.
# At least one of the .so files in /opt/pylon/lib is corrupted by the strip action, 
# so /opt/pylon/lib must be copied via its parent directory. 
runtime_files:
  - /opt/pylon
