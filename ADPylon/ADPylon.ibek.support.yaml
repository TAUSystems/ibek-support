# yaml-language-server: $schema=../schemas/ibek.support.schema.json

module: ADPylon

entity_models:
  - name: BaslerCamera
    description: |-
      Creates a Basler camera areaDetector driver
    parameters:
      ID:
        type: str
        description: |-
          either the serial number of the camera or the camera index number in the 
          system. The serial number is normally printed on the camera, and it is 
          also the last part of the camera name returned by arv-tool, for example 
          for "Basler-23524298", it would be 23524298. If cameraId is less than 
          1000 it is assumed to be the system index number, if 1000 or greater it 
          is assumed to be a serial number.

      P:
        type: str
        description: |-
          PV Prefix

      R:
        type: str
        description: |-
          PV Suffix

      PORT:
        type: str
        description: |-
          Port name for the camera

      MEMORY:
        type: int
        description: |-
          Maximum amount of memory the NDArrayPool is allowed to allocate. 0 means unlimited.
        default: 0

      PRIORITY:
        type: int
        description: |-
          Priority of the port thread. 0 means medium priority.
        default: 0

      STACKSIZE:
        type: int
        description: |-
           0 means medium size.
        default: 0

      TIMEOUT:
        type: int
        description: |-
          Timeout, default 1
        default: 1

      ADDR:
        type: int
        description: |-
          Asyn Port address, default 0
        default: 0


    pre_init:
      - value: |
          # ADPylonConfig(const char *portName, const char *cameraName, size_t maxMemory, int priority, int stackSize)
          ADPylonConfig("{{PORT}}", "{{ID}}", {{MEMORY}}, {{PRIORITY}}, {{STACKSIZE}})

    databases:
      - file: $(ADPYLON)/db/pylon.template
        args: { P, R, PORT, TIMEOUT, ADDR }

    # TODO
    pvi:
      yaml_path: ADPylon.pvi.device.yaml
      ui_macros:
        P:
        R:
      pv: true
      pv_prefix: $(P)$(R)

