# yaml-language-server: $schema=../schemas/ibek.support.schema.json

module: ADPylon

entity_models:
  - name: BaslerCamera
    description: |-
      Creates a Basler camera areaDetector driver
    parameters:
      ID:
        type: str
        description: |-
          Basler ID of camera, e.g. 40522069

      P:
        type: str
        description: |-
          PV Prefix

      R:
        type: str
        description: |-
          PV Suffix

      PORT:
        type: id
        description: |-
          Port name for the camera

      CACHING:
        type: bool
        description: |-
          Enable/disable caching of camera parameters
        default: true

      BUFFERS:
        type: int
        description: |-
          Maximum number of NDArray buffers to be created for plugin callbacks
        default: 50

      MEMORY:
        type: int
        description: |-
          Max memory to allocate, should be maxw*maxh*nbuffer for driver and all attached plugins
        default: -1

      TIMEOUT:
        type: int
        description: |-
          Timeout, default 1
        default: 1

      ADDR:
        type: int
        description: |-
          Asyn Port address, default 0
        default: 0


    pre_init:
      - value: |
          # TODO
          aravisConfig("{{PORT}}", "{{ID}}", {{CACHING | int}}, {{MEMORY}}, 0, 1)

    databases:
      # TODO
      - file: $(ADARAVIS)/db/aravisCamera.template
        args: { P, R, PORT, TIMEOUT, ADDR }

    # TODO
    pvi:
      yaml_path: ADAravis.pvi.device.yaml
      ui_macros:
        P:
        R:
      pv: true
      pv_prefix: $(P)$(R)

  # TODO
  - name: aravisSettings

    description: |
      Create detailed settings screens for an Aravis camera from one of
      the predefined database files in ADGenICam or from the auto generated
      database file for a specific camera.

      Specify which one using the CLASS parameter or leave CLASS as the
      default value to auto generate database file. In this case start.sh
      will contact the camera and generate the database file from its XML
      description of all its configuration parameters.

    parameters:
      camera:
        type: object
        description: the aravisCamera object to create settings for

    pvi:
      # Following discussion with Tom Kane et al on Slack on 3/7/26,
      # pvi device yaml will be named ADAravis-{{ P }}.pvi.device.yaml
      # whether CLASS=='AutoADGenICam' or not. This keeps things simple
      # for techui-support.
      yaml_path: "{{ 'ADAravis-' ~ camera.P }}.pvi.device.yaml"
      ui_macros:
        P: "{{ camera.P }}"
        R: "{{ camera.R }}"
      pv: true
      pv_prefix: "{{ camera.P }}{{ camera.R }}"

    databases:
      # If CLASS=='AutoADGenICam', the template will be named similarly to
      # pvi device yaml. If not, the name is CLASS.template, which is intended
      # to reference predefine template file (this means the template name's format is 
      # different from that of pvi device yaml).
      - file: "{{ 'ADAravis-' ~ camera.P if camera.CLASS=='AutoADGenICam' else camera.CLASS }}.template"
        args:
          P: "{{ camera.P }}"
          R: "{{ camera.R }}"
          PORT: "{{ camera.PORT }}"
          TIMEOUT: "{{ camera.TIMEOUT }}"
          ADDR: "{{ camera.ADDR }}"
